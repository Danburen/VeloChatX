# Admin messages (not recommended to modify)
# These messages are for admin/console only, not visible to regular players
# Version of this file, generally does not need to be changed, used for update checks
config-version: 2.0.1

# Channel info
show-channel-info-command-title: "The current channels are as follows: Channel ID | Channel Name (Total Online Players) | Sub-servers Included (Online Players)"

# Log format
ban-words-log-message: "{Player} §c's message contains sensitive/forbidden words:§r {Message}"

# Internal hints
use-default-chat-format-message: "Using the default chat format %s"
fail-parsing-chat-format-message: "An error occurred while parsing the chat format. Please check if the chat format in config.yml is configured correctly\n{Server}, {Player}, and {Message} are all required."
crossing-chat-disable-message: "§8Crossing server chat now is disabled§r"
broadcast-disable-message: "§8Broadcast system now is disabled§r"

# Startup load summary (logged to console while loading)
server-load-all-online-message: "Detected %d server(s), all online."
server-load-partial-message: "Detected %d server(s), §a%s§r online, §c%s§r not online yet."
server-load-none-online-message: "Detected %d server(s), all not online yet: §c%s§r."
channel-load-message: "Loaded %d channel(s) (%s)"
channel-load-count-message: "Loaded %d channel(s)"
broadcast-load-message: "Loaded %d sub-broadcast(s), %d broadcast message(s) in total."

# Command help text
mention-command-format-message: "§6/mention <PlayerName>§r - §4Display a mention message to a specific player. §r"
msg-command-format-message: "§6/vcmsg <PlayerName> [MessageText]§r - §4Send a private message to a specific player. §r"
config-command-format-message: "§6/velochatx config <reload|update|diff> [name/all]§r - §4Reload / add missing keys / show differences§r"
reload-command-format-message: "§6/velochatx reload§r - §4Reload all config files and reschedule timed tasks§r"
help-command-format-message: "§6/velochatx help§r - §4Shows all help for VeloChatX (vcx/chatx)§r"
on-command-format-message: "§6/velochatx on§r - §4Enable cross-server chat support for you. §r"
off-command-format-message: "§6/velochatx off§r - §4Disable cross-server chat support for you. §r"
control-command-format-message: "§6/velochatx block|unblock <PlayerName>§r - §4Block/unblock a player§r"
show-channel-info-command-format-message: "§6/velochatx show-channel-info§r - §4Display information for all channels. §r"
list-command-format-message: "§6/velochatx list §r - §4Show the players you have blocked. §r"
placeholder-command-format-message: "§6/velochatx placeholder {placeholder} §r - §4show server targeted placeholder"
