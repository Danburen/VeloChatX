# VelochatX 2.0.0
# build java version: JE 17
# author: Danburen
# Available language zh,en

# 此文件的版本，通常不需要改变，检测更新需要用到
config-version: 2.1.1
# 自动更新 / 自动下载
check-update:
  enable: true
  auto-download: true

# 插件所有功能是否启用（包括跨服聊天，广播等）
enable: true
# 是否启用debug功能，不推荐开启
debug: false
# 跨服功能是否启用
crossing-chat-enable: true

# 配置聊天输出的格式{xxx}代表替换的变量
# 在message里，这些规则也适用
# channel: 返回玩家所在的服务器频道
# Group: 返回玩家的组别
# Prefix/Suffix: 返回玩家的前/后缀
# Server: 返回玩家所在的服务器，服务器的显示名字可以在下面的 server 来转换后再输出;
# player: 返回玩家的名字
# Message: 玩家的消息文本
# NOTE : SERVER && MESSAGE && PlayName 这三个字段是必须的，如果少了就好用默认的输出format:[{Server}]{PlayerName}: {Message}
# 支持mc的颜色格式包括 §和& 颜色代码，会覆盖原有的颜色
chat-format: "{channel}{Group}{Server}{Prefix}{Player}{Suffix} §8:§r {Message}"


# none:      不转换，适合原版客户端，直接发送原始文本（兼容旧版，Fabric可能显示异常）
# legacy:    转换为 Adventure Legacy Component（推荐，兼容所有服务端，有些老的客户端不是很支持）
# mini-message: 转换为 MiniMessage 格式（支持富文本效果）
chat-format-model: "none"
# 插件消息文件的语音版本，通常依据于您的Java JVM的版本自动设置
locale: zh

# global/locale 这个选项设置在显示给玩家信息(提及，私聊等)是否根据玩家客户端还是服务器的语言显示？
# global: 依据服务器的语言显示给玩家(可以更改设置自定义的消息)
# locale: 依据玩家的客户端的语言显示玩家各种消息(无法自定义消息，只能显示内置的默认的插件消息)
player-locale: global

# 是否在终端输出所有玩家的文本
# 如果觉得服务器内存不够，可以把这个功能关闭尤其是服务器玩家在线人数特别多的时候
log-text:
  enable: true
  # 是否要转换输出到终端的文本颜色(实现和游戏中一样的效果，日志中不会显示颜色代码，不影响游戏中输出的颜色)
  convert: true


# 服务器绑定（推荐）
#   display-enable : 未声明的后端是否补中括号显示名（旧键 server-display.enable 存在时优先），可选，默认 false
#   proxy  : 代理服显示名（{proxy}；旧键 server-display.proxy 存在时优先），可选
#   list   : 各后端服务器绑定
# list 下的键必须等于 Velocity.toml -> [servers] 的服务器 id（区分大小写）。
#   display  : 显示名（等价于旧的 server-display.display.<id>），可选
#   channels : 该服务器所属频道（等价于在 channels.channel-list.<频道>.servers 里列出它），可选
# 结构与下面 channels.channel-list 对称，可按同样格式一行一行往下加：
#   <服务器id>:
#     display: "显示名"
#     channels:
#       - <频道名>
# 未在此声明的后端：display-enable=true 时 {server} 输出 [原始名]，{channel} 为空；display-enable=false 时输出原始名。
# 【注意】若任一 channels.channel-list.<频道>.servers 为非空列表（旧绑定模式），
#         则本节所有 channels 被整体忽略，成员以 channel-list 为准；仅 display 仍逐项生效。
server:
  display-enable: true
  proxy: "[§5代理服§r]"
  list:
    lobby:
      display: "[§d大厅服§r]"
      channels:
        - login
    server1:
      display: "[§3小游戏服§r]"
      channels:
        - games
    server2:
      display: "[§2生存服§r]"
      channels:
        - survive

# @自 1.4.0 版本加入
# 为每个服务器分组
# 一组频道可以有多个子服务器，一个服务器可以在多个频道内
# 当某个服务器在多个频道同时出现的时候 {channel} 默认替换成 首次 出现的服务器
# global 为 false 的时候则仅仅频道内的服务器消息互通
# global 被设置 true 则所有服务器的消息(不论是否在频道内)都会互通
# 若某个服务器不在频道内，则默认接入global，即全服互通，{channel} 占位符则会被替换成空字符串
# 【重要】成员关系写在 server.list.<频道>（见上方）；channels.*.servers 为旧形态，
#         /velochatx config migration 会删除它们。不存在的服务器 id 会被丢弃并 WARNING 提示。
channels:
  global: true
  channel-list:
    login:
      display: "[§6登录频道§r]"
      welcome:
        enable: true
        message: "欢迎加入登录频道"
    games:
      display: "[§6小游戏频道§r]"
      welcome:
        enable: true
        message: "欢迎加入小游戏频道"
    survive:
      display: "[§6生存频道§r]"
      welcome:
        enable: true
        message: "欢迎加入生存频道"
    # 可以按照以上的格式往下添加多个频道(请注意格式要保持一致)

# 是否在提醒的时候给玩家大屏幕显示标题
mention-show-title:
  enable: true
  # 显示Title的时间,秒为单位，支持整数，非整数自动四舍五入。分别是淡入，停留，淡出的持续时间。
  time:
    fade-in: 1
    stay: 2
    fade-out: 1

# 为原本的玩家Tab替换，每个玩家前面加上显示当前的服务器
# interval 请注意该选项在玩家多的时候尽量设置较大的数值，玩家越多占用的资源会更大
# 本插件自 2.1 开始启用pipe line模式对 tab-list 进行刷新调整，刷新间隔将根据代理夫全部的玩家人数反比进行调整
# 具体计算过程为：刷新间隔 = interval * (1 + (在线人数 / 20) * refresh-ratio)
tab-list:
  enable: true
  refresh-ratio: 0.5 # 动态刷新比例，值越大刷新越慢，为 0 表示固定频率刷新，会限定在 [0, 1] 之间
  interval: 1000 # 基础刷新间隔，毫秒为单位 输入0则表示不刷新
  format: "{server}{prefix}{player}{Suffix}" # 显示的每行的每个玩家的tab的格式  可以参考chat的format的占位符以及服务器的占位符
  header: "欢迎加入{proxy} 当前服务器: {server}"
  footer: "在线人数 §8{online}§r / §8{total_online}§r | Ping: §8{ping}"

# 违禁词语,以","分隔
ban-words:
  enable: true
  log-to-console: true
  words: "操,干,日,狗,垃圾,傻逼"